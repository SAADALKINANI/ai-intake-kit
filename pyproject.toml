[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intake-kit"
version = "0.1.0"
description = "Intake forms, high-impact screening (OMB M-25-21), minimum-practice gap checks and inventory export for federal AI use cases"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aiintake = "aiintake.cli:main"

[tool.setuptools]
packages = ["aiintake"]

[tool.setuptools.package-data]
aiintake = ["templates/*.yaml"]
